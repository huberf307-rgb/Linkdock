    <mask id="mL" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><path d="M300 236 a70 70 0 0 1 140 0 V610 H704 a70 70 0 0 1 0 140 H370 a70 70 0 0 1 -70 -70 Z" fill="#fff"/></mask>
    <g mask="url(#mL)">
